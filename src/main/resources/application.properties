# Terramail Application Configuration

# Database Configuration
db.url=jdbc:mysql://localhost:3306/terramail?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=
db.pool.size=10
db.minimumIdle=2

# IMAP Configuration
imap.default.port=993
imap.ssl.enabled=true
imap.timeout=30000

# SMTP Configuration
smtp.default.port=587
smtp.starttls.enabled=true
smtp.timeout=30000

# Sync Configuration
sync.interval.seconds=300
sync.on.startup=true
sync.on_startup=true

# Application
app.name=Terramail
app.version=1.0.0
app.data.dir=${user.home}/.terramail
app.attachments.dir=${app.data.dir}/attachments
